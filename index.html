<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apollo Freight Solutions</title>
    <style>
      :root {
        --navy: #12325f;
        --blue: #1f6fbf;
        --orange: #d96f16;
        --line: #d9e2ef;
        --text: #102033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background: #f5f8fc;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .front-page {
        width: min(980px, 100%);
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        min-height: 560px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: #ffffff;
        box-shadow: 0 24px 60px rgba(18, 50, 95, 0.16);
      }

      .brand-panel {
        background: var(--navy);
        color: #ffffff;
        padding: 46px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .brand-row {
        display: flex;
        gap: 14px;
        align-items: center;
      }

      .brand-logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        background: #ffffff;
        border-radius: 8px;
        padding: 8px;
      }

      .eyebrow {
        margin: 0 0 8px;
        text-transform: uppercase;
        letter-spacing: 0;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--orange);
      }

      h1 {
        margin: 0;
        font-size: 2.25rem;
        line-height: 1.1;
      }

      .tagline {
        font-size: 1.1rem;
        line-height: 1.55;
        color: #dbeafe;
        margin: 28px 0 0;
      }

      .link-panel {
        padding: 54px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .welcome {
        font-size: 1.9rem;
        line-height: 1.2;
        margin: 0 0 12px;
        color: var(--navy);
      }

      .intro {
        margin: 0 0 28px;
        color: #526579;
        line-height: 1.55;
      }

      .link-actions {
        display: grid;
        gap: 14px;
      }

      .link-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 58px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        text-decoration: none;
        color: var(--navy);
        font-weight: 700;
        background: #ffffff;
      }

      .link-button.primary {
        color: #ffffff;
        border-color: var(--blue);
        background: var(--blue);
      }

      .link-button span {
        font-size: 1.35rem;
        color: var(--orange);
      }

      .link-button.primary span {
        color: #ffffff;
      }

      .footer-note {
        margin-top: 28px;
        font-size: 0.82rem;
        color: #64748b;
      }

      @media (max-width: 760px) {
        body {
          padding: 14px;
        }

        .front-page {
          grid-template-columns: 1fr;
          min-height: 0;
        }

        .brand-panel,
        .link-panel {
          padding: 28px;
        }

        h1,
        .welcome {
          font-size: 1.75rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="front-page">
      <section class="brand-panel">
        <div>
          <div class="brand-row">
            <img class="brand-logo" src="./assets/logo.png" alt="Apollo Freight Solutions logo" onerror="this.hidden=true" />
            <div>
              <p class="eyebrow">   <span class="afs">A</span>pollo   <span class="afs">F</span>reight   <span class="afs">S</span>olutions </p>
              <h1>   Welcome to   <span class="afs">A</span>pollo   <span class="afs">F</span>reight   <span class="afs">S</span>olutions </h1>
            </div>
          </div>
          <p class="tagline">We Bring Continents closer...</p>
        </div>
        <p class="footer-note">Designed by ApolloIT | Copyright 2026 Apollo Freight Solutions.</p>
      </section>

      <section class="link-panel" aria-label="Apollo links">
        <h2 class="welcome">   Welcome to   <span class="afs">A</span>pollo   <span class="afs">F</span>reight   <span class="afs">S</span>olutions </h2>
        <p class="intro">Choose the service you want to open.</p>
        <div class="link-actions">
          <a class="link-button primary" href="/web">
            Cargo ERP
            <span aria-hidden="true">></span>
          </a>
          <a class="link-button" href="https://apollo-freight-client.vercel.app/">
            Client Portal
            <span aria-hidden="true">></span>
          </a>
          <a class="link-button" href="https://apollo-freight.com/">
            Apollo Freight Website
            <span aria-hidden="true">></span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
