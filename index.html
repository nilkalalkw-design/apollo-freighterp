<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apollo Freight ERP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section id="loginScreen" class="login-screen">
      <div class="login-card">
        <div class="brand-row">
          <div class="brand-mark">A F S</div>
          <div>
            <p class="eyebrow">Apollo Freight Solutions</p>
            <h1>Cargo Shipments ERP</h1>
          </div>
        </div>
        <form id="loginForm" class="login-form">
          <label>
            User name
            <input name="userName" autocomplete="username" value="admin" required />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" value="admin123" required />
          </label>
          <button type="submit">Login</button>
          <p id="loginMessage" class="form-message" role="status"></p>
        </form>
      </div>
    </section>

    <div id="appShell" class="app-shell is-hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark">A F S</div>
          <div>
            <p class="eyebrow">Apollo Freight Solutions</p>
            <h2>Freight ERP</h2>
          </div>
        </div>
        <nav id="moduleNav" class="nav-list" aria-label="ERP sections"></nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="page-heading">
            <p id="pageEyebrow" class="eyebrow">Dashboard</p>
            <h1 id="pageTitle">Dashboard</h1>
            <p id="pageSubtitle">Live operational summary for land freight consolidation</p>
          </div>
          <div class="top-actions">
            <label>
              Global search
              <input id="globalSearch" placeholder="Job, invoice, customer, route" />
            </label>
            <label>
              From
              <input id="fromDate" type="date" />
            </label>
            <label>
              To
              <input id="toDate" type="date" />
            </label>
            <button id="resetFilters" type="button">Reset</button>
            <button id="logoutButton" type="button">Logout</button>
          </div>
        </header>

        <div id="apiBanner" class="api-banner"></div>
        <section id="moduleContent" class="module-content" aria-live="polite"></section>
      </main>
    </div>

    <dialog id="recordDialog" class="record-dialog">
      <form method="dialog">
        <div class="dialog-header">
          <div>
            <p id="dialogType" class="eyebrow">Record</p>
            <h2 id="dialogTitle">Record details</h2>
          </div>
          <button value="close" class="secondary-button">Close</button>
        </div>
        <div id="dialogBody" class="dialog-body"></div>
        <div class="dialog-actions">
          <button id="dialogSave" type="button">Save Changes</button>
        </div>
      </form>
    </dialog>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
